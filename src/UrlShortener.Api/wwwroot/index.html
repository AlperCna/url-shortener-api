<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener API</title>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --text: #1a1d29;
    --text-muted: #666b80;
    --border: #e2e4ec;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-text: #ffffff;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --code-bg: #f1f2f7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 24px;
  }

  header.hero {
    text-align: center;
    margin-bottom: 32px;
  }

  header.hero .logo {
    font-size: 40px;
    margin-bottom: 8px;
  }

  header.hero h1 {
    font-size: 28px;
    margin: 0 0 8px;
  }

  header.hero p {
    color: var(--text-muted);
    margin: 0;
    font-size: 15px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }

  footer {
    text-align: center;
    padding: 24px 0 8px;
    color: var(--text-muted);
    font-size: 14px;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
    margin: 0 8px;
  }

  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="logo" aria-hidden="true">🔗</div>
    <h1>URL Shortener API</h1>
    <p>Shorten any link, with optional expiry, one-time use, and password protection. Built with ASP.NET Core and PostgreSQL.</p>
  </header>

  <section id="shorten-section" class="card" aria-labelledby="shorten-heading"></section>

  <section id="stats-section" class="card" aria-labelledby="stats-heading"></section>

  <section id="features-section"></section>

  <footer>
    <a href="https://github.com/AlperCna/url-shortener-api" target="_blank" rel="noopener">View on GitHub</a>
    <a href="/swagger">API docs</a>
  </footer>
</main>
</body>
</html>
